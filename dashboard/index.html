<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Graveyard Shift</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b0c0f'/%3E%3Cpath d='M20.5 6.5a10 10 0 1 0 5 15.6A8.5 8.5 0 0 1 20.5 6.5z' fill='%23ece9e2'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #0b0c0f;
  --panel: #121419;
  --panel-2: #181b22;
  --line: #242833;
  --line-2: #323847;
  --text: #ece9e2;
  --text-2: #a8acb7;
  --text-3: #6e7380;

  --pending: #9aa6bd;
  --claimed: #4fc0ff;
  --done: #7fd58f;
  --warn: #ffb547;
  --reclaim: #ff5a47;
  --note: #b9a6ff;

  --sans: "SF Pro Display", "Inter", "Helvetica Neue", system-ui, -apple-system, sans-serif;
  --mono: "SF Mono", "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --radius: 14px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: clamp(14px, 0.95vw, 26px); background: var(--bg); color-scheme: dark; }
body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: grid;
  grid-template-rows: auto auto minmax(0, 1fr);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  font-variant-numeric: tabular-nums;
}
code, .mono { font-family: var(--mono); }
svg { display: block; flex: none; }

/* flash across the whole viewport when a reclaim lands */
body::after {
  content: ""; position: fixed; inset: 0; pointer-events: none; opacity: 0;
  box-shadow: inset 0 0 0 6px var(--reclaim), inset 0 0 160px 20px rgba(255, 90, 71, .38);
}
body.flash::after { animation: vignette 2.4s ease-out; }
@keyframes vignette { 0% { opacity: 1; } 100% { opacity: 0; } }

/* ------------------------------------------------------------- header */
header {
  display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 3rem;
  padding: 1.05rem 2.25rem; border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 1rem; min-width: 0; }
.brand h1 { font-size: 1.55rem; font-weight: 650; letter-spacing: -0.015em; line-height: 1.1; white-space: nowrap; }
.brand p { font-size: .85rem; color: var(--text-3); margin-top: .3rem; letter-spacing: .02em; }
.brand p b { color: var(--text-2); font-weight: 500; font-family: var(--mono); }

.alive { text-align: right; }
.alive .k { font-size: .8rem; letter-spacing: .14em; text-transform: uppercase; color: var(--text-3); font-weight: 600; }
.alive .v { font-size: 3rem; font-weight: 600; letter-spacing: -0.03em; line-height: 1.05; margin-top: .15rem; }
.alive .v em { font-style: normal; font-weight: 500; color: var(--text-3); font-size: .55em; letter-spacing: 0; margin-right: .45rem; }
.alive .v small { font-size: .5em; color: var(--text-2); font-weight: 500; }

.beat { display: flex; align-items: center; gap: 1.1rem; padding-left: 3rem; border-left: 1px solid var(--line); }
.beat-ring { position: relative; width: 4.4rem; height: 4.4rem; }
.beat-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.beat-ring .track { stroke: var(--line-2); }
.beat-ring .sweep { stroke: var(--done); stroke-linecap: round; transition: stroke .3s; }
.beat-ring .core {
  position: absolute; left: 50%; top: 50%; width: 1.15rem; height: 1.15rem; margin: -.575rem 0 0 -.575rem;
  border-radius: 50%; background: var(--done);
}
.beat-ring .core.pulse { animation: core-pulse .9s ease-out; }
@keyframes core-pulse {
  0% { transform: scale(1.9); box-shadow: 0 0 0 0 rgba(127, 213, 143, .7); }
  100% { transform: scale(1); box-shadow: 0 0 0 1.1rem rgba(127, 213, 143, 0); }
}
.beat.late .sweep { stroke: var(--warn); } .beat.late .core { background: var(--warn); }
.beat.rest .sweep { stroke: var(--text-3); stroke-dasharray: none; } .beat.rest .core { background: var(--text-3); }
.beat .k { font-size: .8rem; letter-spacing: .14em; text-transform: uppercase; color: var(--text-3); font-weight: 600; }
.beat .n { font-size: 2.3rem; font-weight: 600; letter-spacing: -0.02em; line-height: 1.05; margin-top: .15rem; font-family: var(--mono); }
.beat .n span { font-size: .45em; color: var(--text-3); font-family: var(--sans); font-weight: 500; margin-right: .4rem; letter-spacing: 0; }
.beat .ago { font-size: .95rem; color: var(--text-2); margin-top: .2rem; white-space: nowrap; }
.beat .ago b { color: var(--text); font-weight: 600; }

/* ------------------------------------------------------------- banner */
.banner-wrap { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .45s cubic-bezier(.2, .8, .2, 1); }
.banner-wrap.show { grid-template-rows: 1fr; }
.banner-wrap > div { overflow: hidden; }
.banner {
  position: relative; display: flex; align-items: center; gap: 1.5rem;
  padding: .8rem 2.25rem; background: var(--reclaim); color: #1c0603;
}
.banner .ic { width: 2.7rem; height: 2.7rem; flex: none; }
.banner .tag { font-size: .8rem; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; opacity: .75; }
.banner .big { font-size: 1.95rem; font-weight: 750; letter-spacing: -0.02em; line-height: 1.12; margin-top: .1rem; }
.banner .sub { font-size: 1.05rem; margin-top: .25rem; font-weight: 500; opacity: .85; }
.banner .count { position: absolute; left: 0; bottom: 0; height: 4px; background: rgba(28, 6, 3, .55); width: 100%; transform-origin: left; }
.banner-wrap.show .count { animation: drain var(--hold, 12s) linear forwards; }
@keyframes drain { to { transform: scaleX(0); } }

/* --------------------------------------------------------------- main */
main {
  display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 1.75rem;
  padding: 1.4rem 2.25rem 2.4rem; min-height: 0;
}
section.board, aside { min-height: 0; display: flex; flex-direction: column; }
aside { gap: 1.25rem; }
h2.sec {
  display: flex; align-items: baseline; justify-content: space-between;
  font-size: .85rem; font-weight: 650; letter-spacing: .14em; text-transform: uppercase; color: var(--text-3);
  margin-bottom: .9rem;
}
h2.sec span { letter-spacing: 0; text-transform: none; font-weight: 500; font-size: .95rem; color: var(--text-3); }

/* --------------------------------------------------------- task lanes */
.lanes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.1rem; flex: 1; min-height: 0; }
.lane { display: flex; flex-direction: column; min-height: 0; background: rgba(255, 255, 255, .015); border: 1px solid var(--line); border-radius: var(--radius); padding: .9rem; gap: .75rem; }
.lane-head { display: flex; align-items: center; gap: .7rem; padding: .1rem .15rem .35rem; }
.lane-head svg { width: 1.4rem; height: 1.4rem; }
.lane-head .name { font-size: 1.15rem; font-weight: 650; letter-spacing: -0.005em; }
.lane-head .cnt { margin-left: auto; font-family: var(--mono); font-size: 1.15rem; font-weight: 600; color: var(--text-2); }
.lane[data-s="pending"] { --c: var(--pending); }
.lane[data-s="claimed"] { --c: var(--claimed); }
.lane[data-s="done"]    { --c: var(--done); }
.lane-head svg { color: var(--c); }
.lane-head .sub { font-size: .85rem; color: var(--text-3); }
.cards { display: flex; flex-direction: column; gap: .75rem; min-height: 0; overflow-y: auto; flex: 1; scrollbar-width: none; padding: 2px; margin: -2px; }
.cards::-webkit-scrollbar { display: none; }
.lane-empty { border: 1.5px dashed var(--line-2); border-radius: 12px; padding: 1.4rem 1rem; color: var(--text-3); font-size: .95rem; text-align: center; }

.card {
  --c: var(--pending);
  position: relative; background: var(--panel); border: 1px solid var(--line); border-left: 5px solid var(--c);
  border-radius: 12px; padding: .85rem 1rem .95rem; display: flex; flex-direction: column; gap: .6rem;
  transition: background .4s, border-color .4s, box-shadow .4s;
}
.card[data-s="pending"] { --c: var(--pending); border-left-style: dashed; }
.card[data-s="claimed"] { --c: var(--claimed); background: #10202b; }
.card[data-s="done"]    { --c: var(--done); background: var(--panel); }
.card[data-s="done"] .title { color: var(--text-2); }
.card.quiet { --c: var(--warn); background: #251d0e; }
.card.critical { --c: var(--reclaim); background: #2a1210; }
.card.reclaimed { --c: var(--reclaim); background: #260f0e; border-color: rgba(255, 90, 71, .45); border-left-style: solid; }
.card.just { animation: card-hit 1.1s ease-out 3; box-shadow: 0 0 0 3px var(--reclaim), 0 0 38px 4px rgba(255, 90, 71, .5); }
@keyframes card-hit { 0%, 100% { box-shadow: 0 0 0 3px var(--reclaim), 0 0 38px 4px rgba(255, 90, 71, .5); } 50% { box-shadow: 0 0 0 3px var(--reclaim), 0 0 8px 0 rgba(255, 90, 71, .2); } }

.card-top { display: flex; align-items: center; gap: .75rem; }
.glyph { width: 1.9rem; height: 1.9rem; color: var(--c); }
.tid { font-family: var(--mono); font-size: 1rem; color: var(--text-2); font-weight: 500; }
.pill { margin-left: auto; font-size: .72rem; font-weight: 750; letter-spacing: .14em; text-transform: uppercase; color: var(--c); border: 1.5px solid var(--c); border-radius: 999px; padding: .22rem .65rem; }
.title { font-size: 1.4rem; font-weight: 600; letter-spacing: -0.015em; line-height: 1.2; }
.meta { display: flex; flex-wrap: wrap; gap: .45rem; align-items: center; }
.chip { font-family: var(--mono); font-size: .85rem; color: var(--text-2); background: rgba(255, 255, 255, .05); border-radius: 6px; padding: .2rem .55rem; }
.attempt { font-size: .85rem; font-weight: 650; color: var(--text-2); background: rgba(255, 255, 255, .05); border-radius: 6px; padding: .2rem .55rem; }
.attempt.retry { color: #2a0b07; background: var(--reclaim); }

.glyph .spin { transform-origin: 16px 16px; animation: spin 1.1s linear infinite; }
.card.quiet .glyph .spin, .card.critical .glyph .spin { animation-duration: 3.2s; }
.card.critical .glyph .spin { animation: none; }
@keyframes spin { to { transform: rotate(360deg); } }

.holder { display: flex; align-items: center; gap: .65rem; font-size: 1.05rem; color: var(--text-2); }
.holder b { color: var(--text); font-weight: 600; }
.av { display: grid; place-items: center; width: 1.9rem; height: 1.9rem; border-radius: 8px; font-weight: 750; font-size: .95rem; color: #101114; background: var(--ac, #888); flex: none; text-transform: uppercase; }

.meter { height: .55rem; border-radius: 99px; background: rgba(255, 255, 255, .08); overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: var(--claimed); border-radius: 99px; transition: background .3s; }
.card.quiet .meter i { background: var(--warn); }
.card.critical .meter i { background: var(--reclaim); }
.meter-t { display: flex; justify-content: space-between; font-size: .88rem; color: var(--text-3); margin-top: .4rem; }
.meter-t b { color: var(--text); font-weight: 600; font-family: var(--mono); }
.card.quiet .meter-t b { color: var(--warn); } .card.critical .meter-t b { color: var(--reclaim); }

.wait { font-size: 1rem; color: var(--text-3); }
.strip { display: flex; align-items: flex-start; gap: .7rem; background: rgba(255, 90, 71, .14); border: 1px solid rgba(255, 90, 71, .5); border-radius: 9px; padding: .7rem .8rem; color: #ffb7ad; font-size: 1rem; line-height: 1.3; }
.strip svg { width: 1.35rem; height: 1.35rem; color: var(--reclaim); margin-top: .05rem; }
.strip b { color: #fff; font-weight: 650; }
.strip small { display: block; font-size: .85rem; color: #d98a80; margin-top: .15rem; }
.card.entering { animation: enter .6s cubic-bezier(.2, .8, .2, 1); }
@keyframes enter { from { opacity: 0; transform: translateY(10px); } }

/* ------------------------------------------------------------- agents */
.agents { display: flex; flex-direction: column; gap: .7rem; }
.agent { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 1rem; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: .9rem 1.1rem; --c: var(--text-3); transition: background .4s, border-color .4s; }
.agent .av { width: 2.7rem; height: 2.7rem; font-size: 1.3rem; border-radius: 11px; }
.agent .nm { font-size: 1.35rem; font-weight: 620; letter-spacing: -0.01em; }
.agent .st { font-size: 1rem; color: var(--text-2); margin-top: .1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.agent .st b { font-family: var(--mono); font-weight: 500; color: var(--text); }
.agent .badge { display: flex; align-items: center; gap: .55rem; font-size: .8rem; font-weight: 750; letter-spacing: .13em; text-transform: uppercase; color: var(--c); }
.agent .badge svg { width: 1.3rem; height: 1.3rem; }
.agent.working { --c: var(--claimed); border-color: rgba(79, 192, 255, .35); }
.agent.quiet { --c: var(--warn); background: #251d0e; border-color: rgba(255, 181, 71, .55); }
.agent.lost { --c: var(--reclaim); background: #2a1210; border-color: rgba(255, 90, 71, .7); }
.agent.finished { --c: var(--done); }
.agent.working .badge .dot { animation: dot 1.4s ease-in-out infinite; }
@keyframes dot { 50% { opacity: .35; } }
.agent.lost .nm { text-decoration: line-through; text-decoration-thickness: 2px; text-decoration-color: rgba(255, 90, 71, .8); }
.agents-empty { color: var(--text-3); font-size: 1rem; border: 1.5px dashed var(--line-2); border-radius: 12px; padding: 1.1rem; text-align: center; }

/* ---------------------------------------------------------------- log */
.log-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.log { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: .5rem; padding-right: .35rem; scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
.entry { --c: var(--text-3); display: grid; grid-template-columns: 1.4rem 4.6rem minmax(0, 1fr); gap: .8rem; align-items: start; padding: .6rem .85rem; border-radius: 10px; border-left: 3px solid var(--c); background: var(--panel); font-size: 1rem; line-height: 1.35; }
.entry svg { width: 1.3rem; height: 1.3rem; color: var(--c); margin-top: .1rem; }
.entry time { font-family: var(--mono); font-size: .85rem; color: var(--text-3); padding-top: .2rem; }
.entry .kind { font-size: .7rem; font-weight: 750; letter-spacing: .14em; text-transform: uppercase; color: var(--c); display: block; margin-bottom: .1rem; }
.entry .d { color: var(--text-2); overflow-wrap: anywhere; }
.entry .d code { color: var(--text); font-size: .9em; }
.entry .d b { font-weight: 620; color: var(--text); }
.entry.k-submitted { --c: var(--pending); }
.entry.k-claimed { --c: var(--claimed); }
.entry.k-progress { --c: var(--text-3); background: transparent; padding-top: .3rem; padding-bottom: .3rem; font-size: .92rem; }
.entry.k-progress .kind { display: none; }
.entry.k-progress .d { color: var(--text-3); }
.entry.k-completed { --c: var(--done); }
.entry.k-note { --c: var(--note); }
.entry.k-reclaimed { --c: var(--reclaim); background: #301311; border-left-width: 6px; padding: .95rem 1rem; grid-template-columns: 1.7rem 4.6rem minmax(0, 1fr); font-size: 1.2rem; box-shadow: 0 0 0 1px rgba(255, 90, 71, .45); }
.entry.k-reclaimed svg { width: 1.7rem; height: 1.7rem; }
.entry.k-reclaimed .kind { font-size: .85rem; }
.entry.k-reclaimed .d { color: #ffd3cc; font-weight: 520; }
.entry.k-reclaimed .d b { color: #fff; }
.entry.k-reclaimed time { color: #d98a80; }
.entry.fresh { animation: slide .55s cubic-bezier(.2, .8, .2, 1); }
.entry.k-reclaimed.fresh { animation: slide .55s cubic-bezier(.2, .8, .2, 1), glow 2.4s ease-out; }
@keyframes slide { from { opacity: 0; transform: translateY(-14px); } }
@keyframes glow { 0% { background: #7a2118; } 100% { background: #301311; } }
.log-empty { color: var(--text-3); padding: 1rem 0; font-size: 1rem; }

/* ---------------------------------------------------- connection pill */
.conn { position: fixed; left: 50%; bottom: .9rem; transform: translateX(-50%); display: flex; align-items: center; gap: .55rem; font-size: .78rem; font-weight: 650; letter-spacing: .12em; text-transform: uppercase; color: var(--text-3); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: .35rem .85rem; z-index: 5; opacity: .9; }
.conn i { width: .6rem; height: .6rem; border-radius: 50%; background: var(--text-3); }
.conn.live i { background: var(--done); } .conn.live { color: var(--text-2); }
.conn.polling i { background: var(--warn); } .conn.polling { color: var(--warn); }
.conn.down i { background: var(--reclaim); animation: dot 1s infinite; } .conn.down { color: var(--reclaim); }

/* ------------------------------------------------------------ welcome */
.hero-empty { grid-column: 1 / -1; margin: auto; text-align: center; max-width: 34rem; }
.hero-empty h3 { font-size: 2rem; font-weight: 620; letter-spacing: -0.02em; }
.hero-empty p { color: var(--text-2); font-size: 1.15rem; margin-top: .8rem; line-height: 1.45; }
.hero-empty code { color: var(--text); background: var(--panel-2); padding: .15rem .5rem; border-radius: 6px; }
[hidden] { display: none !important; }

@media (max-width: 1100px) {
  body { height: auto; overflow: auto; }
  header { grid-template-columns: 1fr; gap: 1.2rem; }
  .beat { padding-left: 0; border-left: 0; }
  .alive { text-align: left; }
  main { grid-template-columns: 1fr; }
  .lanes { grid-template-columns: 1fr; }
  .log { max-height: 60vh; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>

<header>
  <div class="brand">
    <svg width="46" height="46" viewBox="0 0 32 32" aria-hidden="true">
      <rect width="32" height="32" rx="9" fill="#181b22"/>
      <path d="M20.5 6.5a10 10 0 1 0 5 15.6A8.5 8.5 0 0 1 20.5 6.5z" fill="#ece9e2"/>
      <circle cx="22.5" cy="10" r="1.7" fill="#7fd58f"/>
    </svg>
    <div>
      <h1>Graveyard Shift</h1>
      <p>Supervising job <b id="jobid">demo</b></p>
    </div>
  </div>

  <div class="alive">
    <div class="k">Supervisor uptime</div>
    <div class="v" id="alive"><em>alive</em>&ndash;</div>
  </div>

  <div class="beat" id="beat">
    <div class="beat-ring">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <circle class="track" cx="50" cy="50" r="44" fill="none" stroke-width="7"/>
        <circle class="sweep" id="sweep" cx="50" cy="50" r="44" fill="none" stroke-width="7" stroke-dasharray="276.46" stroke-dashoffset="276.46"/>
      </svg>
      <div class="core" id="core"></div>
    </div>
    <div>
      <div class="k">Heartbeat</div>
      <div class="n"><span>beat</span><b id="beats" style="font-weight:600">0</b></div>
      <div class="ago" id="ago">waiting for the first beat</div>
    </div>
  </div>
</header>

<div class="banner-wrap" id="bannerWrap" aria-live="assertive">
  <div>
    <div class="banner" id="banner">
      <svg class="ic" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 14a9.5 9.5 0 1 1 2.6 8.3"/><path d="M6 6.5V14h7.5"/></svg>
      <div>
        <div class="tag">Task reclaimed</div>
        <div class="big" id="bannerBig"></div>
        <div class="sub" id="bannerSub"></div>
      </div>
      <div class="count"></div>
    </div>
  </div>
</div>

<main id="main">
  <section class="board" hidden>
    <h2 class="sec">Task board <span id="boardSum"></span></h2>
    <div class="lanes" id="lanes">
      <div class="lane" data-s="pending">
        <div class="lane-head">
          <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.6" stroke-dasharray="4.2 4.2"><circle cx="16" cy="16" r="11.5"/></svg>
          <div><div class="name">Pending</div><div class="sub">Waiting for an agent</div></div>
          <div class="cnt" data-cnt="pending">0</div>
        </div>
        <div class="cards" data-lane="pending"></div>
      </div>
      <div class="lane" data-s="claimed">
        <div class="lane-head">
          <svg viewBox="0 0 32 32" fill="none" stroke-width="3" stroke-linecap="round"><circle cx="16" cy="16" r="11.5" stroke="currentColor" opacity=".25"/><path d="M16 4.5a11.5 11.5 0 0 1 11.5 11.5" stroke="currentColor"/></svg>
          <div><div class="name">Claimed</div><div class="sub">An agent holds it</div></div>
          <div class="cnt" data-cnt="claimed">0</div>
        </div>
        <div class="cards" data-lane="claimed"></div>
      </div>
      <div class="lane" data-s="done">
        <div class="lane-head">
          <svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="12.5" fill="currentColor"/><path d="M10.5 16.5l3.9 3.9 7.2-8" fill="none" stroke="#0b0c0f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <div><div class="name">Done</div><div class="sub">Finished</div></div>
          <div class="cnt" data-cnt="done">0</div>
        </div>
        <div class="cards" data-lane="done"></div>
      </div>
    </div>
  </section>

  <aside hidden>
    <div>
      <h2 class="sec">Agents <span id="agentSum"></span></h2>
      <div class="agents" id="agents"></div>
    </div>
    <div class="log-wrap">
      <h2 class="sec">Supervisor decisions <span id="logSum"></span></h2>
      <div class="log" id="log"></div>
    </div>
  </aside>
</main>

<div class="conn" id="conn"><i></i><span id="connText">Connecting</span></div>

<script>
"use strict";

/* ================================================================ utils */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let clockOffset = 0; // serverNow - Date.now()
const now = () => Date.now() + clockOffset;

function fmtAlive(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  if (d) return `${d}d ${h}h`;
  if (h) return `${h}h ${String(m).padStart(2, "0")}m`;
  if (m) return `${m}m ${String(sec).padStart(2, "0")}s`;
  return `${sec}s`;
}
const fmtSecs = (ms) => (ms < 0 ? 0 : ms / 1000).toFixed(1) + "s";
const fmtClock = (t) => new Date(t).toLocaleTimeString([], { hour12: false });

const AGENT_COLORS = { "codex": "#b79cff", "claude-code": "#e8946a", "claude": "#e8946a" };
const PALETTE = ["#7ad0c0", "#e6c36a", "#d98fc0", "#8fb4f2", "#a8d67a"];
function agentColor(name) {
  if (AGENT_COLORS[name]) return AGENT_COLORS[name];
  let h = 0; for (const ch of name) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return PALETTE[h % PALETTE.length];
}
const avatar = (name) => `<span class="av" style="--ac:${agentColor(name)}">${esc(name[0] || "?")}</span>`;

/* ================================================================ icons */
const ICON = {
  pending: `<svg class="glyph" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.6" stroke-dasharray="4.2 4.2"><circle cx="16" cy="16" r="11.5"/></svg>`,
  claimed: `<svg class="glyph" viewBox="0 0 32 32" fill="none" stroke-width="3" stroke-linecap="round"><circle cx="16" cy="16" r="11.5" stroke="currentColor" opacity=".25"/><path class="spin" d="M16 4.5a11.5 11.5 0 0 1 11.5 11.5" stroke="currentColor"/></svg>`,
  done: `<svg class="glyph" viewBox="0 0 32 32"><circle cx="16" cy="16" r="12.5" fill="currentColor"/><path d="M10.5 16.5l3.9 3.9 7.2-8" fill="none" stroke="#0b0c0f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  warn: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"><path d="M12 3.5L22 20.5H2z"/><path d="M12 10v5M12 17.6v.1"/></svg>`,
  cross: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8.5 8.5l7 7M15.5 8.5l-7 7"/></svg>`,
  dotfill: `<svg viewBox="0 0 24 24"><circle class="dot" cx="12" cy="12" r="6" fill="currentColor"/><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.8" opacity=".4"/></svg>`,
  dash: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9.5" stroke-dasharray="3.5 3.5"/></svg>`,
  check: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M7.7 12.4l3 3 5.6-6"/></svg>`,
  undo: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 10.5a7.5 7.5 0 1 1 2 6.2"/><path d="M4.5 5v5.7H10"/></svg>`,
  list: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>`,
  flag: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 21V4M6 5h11l-2.5 4L17 13H6"/></svg>`,
  pulse: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2.5-6 4 12 2.5-6h5"/></svg>`,
  note: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h14v12l-4 4H5z"/><path d="M15 20v-4h4"/></svg>`,
};
const KIND_ICON = { submitted: "list", claimed: "flag", progress: "pulse", completed: "check", reclaimed: "undo", note: "note" };
const KIND_LABEL = { submitted: "Submitted", claimed: "Claimed", progress: "Progress", completed: "Completed", reclaimed: "Reclaimed", note: "Note" };

/* =============================================================== state */
let view = null;
let prevDecisionCount = null;
let prevBeats = null;
const justReclaimed = new Map(); // taskId -> timestamp
let bannerTimer = null;

const RECLAIM_RE = /^(.+?) went quiet for (\d+)s on (\S+)/;
function parseReclaim(d) {
  const m = RECLAIM_RE.exec(d.detail);
  return m ? { who: m[1], secs: Number(m[2]), taskId: m[3], at: d.at } : null;
}
function lastReclaimFor(taskId) {
  if (!view) return null;
  for (let i = view.decisions.length - 1; i >= 0; i--) {
    const d = view.decisions[i];
    if (d.kind !== "reclaimed") continue;
    const r = parseReclaim(d);
    if ((r && r.taskId === taskId) || (!r && d.detail.includes(taskId))) return r || { who: "the agent", secs: null, taskId, at: d.at };
  }
  return null;
}

function normalise(v) {
  return {
    tasks: Array.isArray(v.tasks) ? v.tasks : [],
    decisions: Array.isArray(v.decisions) ? v.decisions : [],
    heartbeatMs: v.heartbeatMs || 5000,
    stallAfterMs: v.stallAfterMs || 12000,
    startedAt: v.startedAt || 0,
    lastBeatAt: v.lastBeatAt || 0,
    beats: v.beats || 0,
  };
}

function setView(raw) {
  const next = normalise(raw);
  // ignore a stale poll that lands after a newer push
  if (view && next.startedAt === view.startedAt && next.decisions.length < view.decisions.length) return;

  const firstLoad = prevDecisionCount === null;
  if (!firstLoad && next.decisions.length > prevDecisionCount && next.startedAt === (view && view.startedAt)) {
    for (const d of next.decisions.slice(prevDecisionCount)) {
      if (d.kind === "reclaimed") onReclaim(d, next);
    }
  }
  prevDecisionCount = next.decisions.length;
  view = next;
  render();
}

function onReclaim(d, v) {
  const r = parseReclaim(d);
  const taskId = r ? r.taskId : (v.tasks.find((t) => d.detail.includes(t.id)) || {}).id;
  if (taskId) justReclaimed.set(taskId, Date.now());
  const task = v.tasks.find((t) => t.id === taskId);
  $("#bannerBig").textContent = r ? `${r.who} went quiet. ${r.taskId} is back in the pool.` : d.detail;
  $("#bannerSub").textContent = task ? `${task.title}  •  ${d.detail}` : d.detail;
  const wrap = $("#bannerWrap");
  wrap.style.setProperty("--hold", "14s");
  wrap.classList.remove("show"); void wrap.offsetWidth; wrap.classList.add("show");
  document.body.classList.remove("flash"); void document.body.offsetWidth; document.body.classList.add("flash");
  clearTimeout(bannerTimer);
  bannerTimer = setTimeout(() => wrap.classList.remove("show"), 14000);
}

/* ============================================================== render */
const cardEls = new Map();
const cardSig = new Map();

function silentMs(t) { return now() - (t.lastProgressAt || t.claimedAt || now()); }

function taskSig(t) {
  const rec = lastReclaimFor(t.id);
  const jr = justReclaimed.has(t.id) && Date.now() - justReclaimed.get(t.id) < 9000;
  return JSON.stringify([t.title, t.files, t.state, t.assignee, t.attempts, rec && [rec.who, rec.secs, rec.at], jr]);
}

function cardHTML(t) {
  const rec = t.state === "pending" ? lastReclaimFor(t.id) : null;
  const prior = t.state !== "pending" ? lastReclaimFor(t.id) : null;
  const stateWord = { pending: "Pending", claimed: "Claimed", done: "Done" }[t.state] || t.state;

  let foot = "";
  if (t.state === "pending") {
    foot = rec
      ? `<div class="strip">${ICON.undo}<div><b>Reclaimed from ${esc(rec.who)}</b>${rec.secs != null ? ` after ${rec.secs}s of silence` : ""}<small>Back in the pool, waiting for the next agent.</small></div></div>`
      : `<div class="wait">Waiting for an agent to claim it.</div>`;
  } else if (t.state === "claimed") {
    foot = `<div class="holder">${avatar(t.assignee || "?")}<span>Held by <b>${esc(t.assignee || "unknown")}</b></span></div>
      <div><div class="meter"><i></i></div>
      <div class="meter-t"><span>Last signal <b data-silent>0.0s</b> ago</span><span data-limit>${fmtSecs(view.stallAfterMs)} limit</span></div></div>`;
  } else {
    foot = `<div class="holder">${avatar(t.assignee || "?")}<span>Finished by <b>${esc(t.assignee || "unknown")}</b></span></div>`;
  }

  const attempt = t.attempts > 0
    ? `<span class="attempt ${t.attempts > 1 ? "retry" : ""}">${t.attempts > 1 ? `Attempt ${t.attempts}  •  retry` : "Attempt 1"}</span>`
    : `<span class="attempt">Not started</span>`;
  const prevNote = prior && t.state === "claimed" ? `<span class="attempt">Reclaimed from ${esc(prior.who)}</span>` : "";

  return `<div class="card-top">${ICON[t.state] || ICON.pending}<span class="tid">${esc(t.id)}</span><span class="pill">${stateWord}</span></div>
    <div class="title">${esc(t.title)}</div>
    <div class="meta">${attempt}${prevNote}${(t.files || []).map((f) => `<span class="chip">${esc(f)}</span>`).join("")}</div>
    ${foot}`;
}

function render() {
  if (!view) return;
  $("#jobid").textContent = window.__jobId || "demo";
  renderBoard();
  renderAgents(true);
  renderLog();
  renderHeader();
  tick();
}

function renderBoard() {
  const lanes = { pending: [], claimed: [], done: [] };
  for (const t of view.tasks) (lanes[t.state] || lanes.pending).push(t);

  // FLIP: remember where every card is before we move anything
  const before = new Map();
  for (const [id, el] of cardEls) before.set(id, el.getBoundingClientRect());

  const seen = new Set();
  for (const [state, list] of Object.entries(lanes)) {
    const host = document.querySelector(`.cards[data-lane="${state}"]`);
    $(`[data-cnt="${state}"]`).textContent = list.length;
    list.forEach((t, i) => {
      seen.add(t.id);
      let el = cardEls.get(t.id);
      const created = !el;
      if (!el) { el = document.createElement("article"); el.className = "card"; el.dataset.id = t.id; cardEls.set(t.id, el); }
      const sig = taskSig(t);
      if (cardSig.get(t.id) !== sig) { el.innerHTML = cardHTML(t); cardSig.set(t.id, sig); }
      el.dataset.s = t.state;
      const rec = t.state === "pending" && lastReclaimFor(t.id);
      el.classList.toggle("reclaimed", !!rec);
      const jr = justReclaimed.has(t.id) && Date.now() - justReclaimed.get(t.id) < 9000;
      el.classList.toggle("just", jr);
      if (t.state !== "claimed") el.classList.remove("quiet", "critical");
      const anchor = host.querySelectorAll(".card")[i];
      if (anchor !== el) host.insertBefore(el, anchor || null);
      if (created) { el.classList.add("entering"); setTimeout(() => el.classList.remove("entering"), 700); }
    });
    // empty placeholders
    let ph = host.querySelector(".lane-empty");
    if (!list.length) {
      if (!ph) { ph = document.createElement("div"); ph.className = "lane-empty"; host.appendChild(ph); }
      ph.textContent = { pending: "Nothing waiting", claimed: "No agent is holding a task", done: "Nothing finished yet" }[state];
    } else if (ph) ph.remove();
  }
  for (const [id, el] of cardEls) if (!seen.has(id)) { el.remove(); cardEls.delete(id); cardSig.delete(id); }

  // play FLIP
  for (const [id, el] of cardEls) {
    const a = before.get(id); if (!a) continue;
    const b = el.getBoundingClientRect();
    const dx = a.left - b.left, dy = a.top - b.top;
    if (Math.abs(dx) < 2 && Math.abs(dy) < 2) continue;
    el.animate([{ transform: `translate(${dx}px, ${dy}px) scale(1.03)`, zIndex: 3 }, { transform: "none", zIndex: 3 }], { duration: 750, easing: "cubic-bezier(.2,.8,.2,1)" });
  }

  const c = (s) => lanes[s].length;
  $("#boardSum").textContent = view.tasks.length ? `${view.tasks.length} tasks  •  ${c("done")} done` : "";

  // welcome state when there is no job
  const emptyJob = !view.tasks.length && !view.startedAt;
  let hero = $("#hero");
  if (emptyJob && !hero) {
    hero = document.createElement("div"); hero.id = "hero"; hero.className = "hero-empty";
    hero.innerHTML = `<h3>No job is running</h3><p>The supervisor for <code>${esc(window.__jobId || "demo")}</code> has no tasks yet. Submit a job and the board fills in live.</p>`;
    $("#main").appendChild(hero);
  }
  if (hero && !emptyJob) hero.remove();
  $(".board").hidden = emptyJob; $("aside").hidden = emptyJob;
}

/* ---------------------------------------------------------- agents */
function deriveAgents() {
  const order = [];
  const add = (n) => { if (n && !order.includes(n)) order.push(n); };
  for (const d of view.decisions) { const m = /^([\w.\-]+) (?:claimed|on|went quiet|finished)\b/.exec(d.detail); if (m) add(m[1]); }
  for (const t of view.tasks) add(t.assignee);

  return order.map((name) => {
    const held = view.tasks.find((t) => t.state === "claimed" && t.assignee === name);
    if (held) {
      const sil = silentMs(held), frac = sil / view.stallAfterMs;
      const st = frac >= 0.85 ? "critical" : frac >= 0.5 ? "quiet" : "working";
      return { name, status: st, held, sil };
    }
    // no live claim: what happened last?
    for (let i = view.decisions.length - 1; i >= 0; i--) {
      const d = view.decisions[i];
      if (!d.detail.startsWith(name + " ")) continue;
      if (d.kind === "reclaimed") { const r = parseReclaim(d); return { name, status: "lost", r }; }
      if (d.kind === "completed") return { name, status: "finished", text: d.detail.replace(/^\S+ finished /, "") };
      break;
    }
    return { name, status: "idle" };
  });
}

let agentSig = "";
function renderAgents(force) {
  const list = deriveAgents();
  const sig = JSON.stringify(list.map((a) => [a.name, a.status, a.held && a.held.id, a.r && a.r.taskId]));
  if (sig !== agentSig || force && sig !== agentSig) {
    agentSig = sig;
    $("#agents").innerHTML = list.length ? list.map((a) => {
      let cls = a.status, badge, text;
      switch (a.status) {
        case "working": badge = ["Working", ICON.dotfill]; text = `On <b>${esc(a.held.id)}</b>  •  signal <b data-asil="${esc(a.name)}"></b> ago`; break;
        case "quiet": badge = ["Gone quiet", ICON.warn]; text = `Silent on <b>${esc(a.held.id)}</b> for <b data-asil="${esc(a.name)}"></b>`; break;
        case "critical": cls = "quiet"; badge = ["Gone quiet", ICON.warn]; text = `Silent on <b>${esc(a.held.id)}</b> for <b data-asil="${esc(a.name)}"></b>`; break;
        case "lost": badge = ["Reclaimed", ICON.cross]; text = `Lost <b>${esc(a.r ? a.r.taskId : "its task")}</b>${a.r && a.r.secs != null ? ` after ${a.r.secs}s of silence` : ""}`; break;
        case "finished": badge = ["Finished", ICON.check]; text = esc(a.text || "Completed its task"); break;
        default: badge = ["Idle", ICON.dash]; text = "No task assigned";
      }
      return `<div class="agent ${cls}" data-agent="${esc(a.name)}">${avatar(a.name)}<div style="min-width:0"><div class="nm">${esc(a.name)}</div><div class="st">${text}</div></div><div class="badge">${badge[1]}<span>${badge[0]}</span></div></div>`;
    }).join("") : `<div class="agents-empty">No agent has checked in yet</div>`;
    const live = list.filter((a) => a.status === "working" || a.status === "quiet" || a.status === "critical").length;
    $("#agentSum").textContent = list.length ? `${live} active  •  ${list.length} seen` : "";
  }
  for (const a of list) {
    if (!a.held) continue;
    const el = document.querySelector(`[data-asil="${CSS.escape(a.name)}"]`);
    if (el) el.textContent = fmtSecs(a.sil);
  }
}

/* ------------------------------------------------------------- log */
let renderedDecisions = 0;
function decorate(text) {
  let h = esc(text);
  h = h.replace(/\btask-\d+\b/g, (m) => `<code>${m}</code>`);
  h = h.replace(/^([\w.\-]+)(?= (?:claimed|on|went quiet|finished))/, (m) => `<b>${m}</b>`);
  return h;
}
function entryEl(d, fresh) {
  const el = document.createElement("div");
  el.className = `entry k-${d.kind}${fresh ? " fresh" : ""}`;
  el.innerHTML = `${ICON[KIND_ICON[d.kind] || "note"]}<time>${fmtClock(d.at)}</time><div><span class="kind">${KIND_LABEL[d.kind] || esc(d.kind)}</span><div class="d">${decorate(d.detail)}</div></div>`;
  return el;
}
function renderLog() {
  const log = $("#log");
  const ds = view.decisions;
  if (ds.length < renderedDecisions || !renderedDecisions) {
    log.innerHTML = "";
    const slice = ds.slice(-150);
    for (let i = slice.length - 1; i >= 0; i--) log.appendChild(entryEl(slice[i], false));
    renderedDecisions = ds.length;
    if (!ds.length) log.innerHTML = `<div class="log-empty">The supervisor has not decided anything yet.</div>`;
  } else if (ds.length > renderedDecisions) {
    for (const d of ds.slice(renderedDecisions)) log.insertBefore(entryEl(d, true), log.firstChild);
    renderedDecisions = ds.length;
    while (log.children.length > 150) log.lastChild.remove();
    log.scrollTop = 0;
  }
  const rc = ds.filter((d) => d.kind === "reclaimed").length;
  $("#logSum").textContent = ds.length ? `${ds.length} decisions  •  ${rc} reclaimed` : "";
}

/* ----------------------------------------------------------- header */
const CIRC = 276.46;
function renderHeader() {
  $("#beats").textContent = view.beats;
  if (prevBeats !== null && view.beats > prevBeats) {
    const core = $("#core"); core.classList.remove("pulse"); void core.offsetWidth; core.classList.add("pulse");
  }
  prevBeats = view.beats;
}

function isFinished() { return view.tasks.length > 0 && view.tasks.every((t) => t.state === "done"); }

function tick() {
  if (!view) return;
  const t = now();

  // uptime
  if (view.startedAt) $("#alive").innerHTML = `<em>alive</em>${esc(fmtAlive(t - view.startedAt))}`;
  else $("#alive").innerHTML = `<em>alive</em>&ndash;`;

  // heartbeat
  const beat = $("#beat"), sweep = $("#sweep"), ago = $("#ago");
  if (!view.lastBeatAt) {
    ago.textContent = view.startedAt ? `first beat in ${fmtSecs(Math.max(0, view.startedAt + view.heartbeatMs - t))}` : "waiting for the first beat";
    sweep.style.strokeDashoffset = CIRC;
    beat.classList.remove("late", "rest");
  } else {
    const age = t - view.lastBeatAt;
    const done = isFinished();
    const late = !done && age > view.heartbeatMs * 2.5 + 1500;
    beat.classList.toggle("rest", done);
    beat.classList.toggle("late", late);
    const frac = Math.min(1, age / view.heartbeatMs);
    sweep.style.strokeDashoffset = done ? 0 : CIRC * (1 - frac);
    ago.innerHTML = done
      ? `Stood down  •  all tasks done`
      : late ? `<b>${fmtSecs(age)}</b> since last beat  •  overdue`
             : `Last beat <b>${fmtSecs(age)}</b> ago  •  every ${fmtSecs(view.heartbeatMs).replace(".0", "")}`;
  }

  // live stall meters
  for (const task of view.tasks) {
    if (task.state !== "claimed") continue;
    const el = cardEls.get(task.id); if (!el) continue;
    const sil = silentMs(task), frac = sil / view.stallAfterMs;
    el.classList.toggle("critical", frac >= 0.85);
    el.classList.toggle("quiet", frac >= 0.5 && frac < 0.85);
    const bar = el.querySelector(".meter i"); if (bar) bar.style.width = Math.min(100, frac * 100) + "%";
    const s = el.querySelector("[data-silent]"); if (s) s.textContent = fmtSecs(sil);
    const lim = el.querySelector("[data-limit]");
    if (lim) lim.textContent = frac >= 1 ? "reclaimed at next beat" : `${fmtSecs(view.stallAfterMs)} limit`;
  }

  // expire the "just reclaimed" ring
  for (const [id, at] of justReclaimed) {
    if (Date.now() - at >= 9000) { justReclaimed.delete(id); cardSig.delete(id); const el = cardEls.get(id); if (el) el.classList.remove("just"); renderBoard(); break; }
  }

  renderAgents();
}

/* ============================================================ network */
const connEl = $("#conn");
function setConn(kind, text) { connEl.className = `conn ${kind}`; $("#connText").textContent = text; }

let ws = null, wsOpen = false, lastMsgAt = 0, retry = 0;

async function getJSON(url) {
  const r = await fetch(url, { cache: "no-store" });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

function onMessage(ev) {
  let m; try { m = JSON.parse(ev.data); } catch { return; }
  lastMsgAt = Date.now();
  if (m && Array.isArray(m.tasks)) return setView(m);                       // full JobView broadcast
  if (m && m.state && Array.isArray(m.state.tasks)) return setView(m.state); // full state on connect
  if (m && m.type === "state_update" && m.changes && view) return setView({ ...view, ...m.changes });
}

async function connect() {
  let sock;
  try {
    const grant = await getJSON("/api/grant"); // always a fresh grant
    if (grant.serverNow) clockOffset = grant.serverNow - Date.now();
    sock = new WebSocket(grant.websocketUrl);
  } catch (e) {
    return scheduleReconnect();
  }
  ws = sock;
  const guard = setTimeout(() => { if (!wsOpen) try { sock.close(); } catch {} }, 5000);
  sock.onopen = () => {
    clearTimeout(guard); wsOpen = true; retry = 0; lastMsgAt = Date.now();
    setConn("live", "Live");
    try { sock.send(JSON.stringify({ kind: "sync" })); } catch {}
  };
  sock.onmessage = onMessage;
  sock.onclose = () => { clearTimeout(guard); if (ws === sock) { wsOpen = false; setConn("polling", "Reconnecting"); scheduleReconnect(); } };
  sock.onerror = () => { try { sock.close(); } catch {} };
}
function scheduleReconnect() {
  retry++;
  setTimeout(connect, Math.min(4000, 400 * retry));
}

// Fallback: poll the actor over RPC whenever the socket is not delivering.
let polling = false;
async function poll() {
  if (polling) return;
  if (wsOpen && Date.now() - lastMsgAt < 8000) return;
  polling = true;
  try {
    const j = await getJSON("/api/snapshot");
    if (j.serverNow) clockOffset = j.serverNow - Date.now();
    setView(j.view);
    if (!wsOpen) setConn("polling", "Polling");
  } catch (e) {
    setConn("down", "Offline");
  } finally { polling = false; }
}

(async function boot() {
  try { const c = await getJSON("/api/config"); window.__jobId = c.jobId; clockOffset = c.serverNow - Date.now(); $("#jobid").textContent = c.jobId; } catch {}
  setConn("polling", "Connecting");
  poll();
  connect();
  setInterval(poll, 500);
  setInterval(tick, 100);
})();
</script>
